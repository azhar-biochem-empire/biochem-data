<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السنة الثالثة - الكيمياء الحيوية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            border: 1px solid var(--accent-gold);
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .header h1 {
            color: var(--accent-gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 20px auto 0;
            display: block;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: #fff;
            font-family: 'Tajawal';
            font-size: 1rem;
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
        }

        .subject-title {
            font-size: 1.3rem;
            color: var(--accent-blue);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid transparent;
        }

        .file-item:hover {
            border-color: var(--border-color);
        }

        .file-name {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .btn-group a {
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 4px;
            display: inline-block;
        }

        .view-btn { background: #0284c7; color: white; }
        .down-btn { background: #059669; color: white; }
        .view-btn:hover { background: #0369a1; }
        .down-btn:hover { background: #047857; }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 المكتبة الأسطورية - السنة الثالثة</h1>
        <p style="color: var(--text-sub);">جميع المحاضرات، السكاشن، والتبييضات الخاصة بالقسم</p>
    </div>

    <div class="grid-container">
        <!-- هنا سيتم إضافة كروت المواد بعد تفنيط الداتا -->
    </div>

</body>
</html>
