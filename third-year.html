<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third Year - Al-Azhar University</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b1325;
            --btn-bg: rgba(15, 30, 50, 0.75);
            --btn-border: rgba(56, 189, 248, 0.25);
            --btn-hover-border: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --alert-bg: rgba(139, 0, 0, 0.55);
            --alert-border: #ff4d4d;
            --text-gold: #fbbf24;
            --text-white: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            /* خلفية علمية فخمة بتأثير زجاجي */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(20, 45, 85, 0.7) 0%, rgba(11, 19, 37, 0.95) 100%),
                url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .portal-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            backdrop-filter: blur(8px);
            padding: 2.5rem 1.5rem;
            border-radius: 20px;
            background: rgba(11, 19, 37, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* Header Style */
        .main-title {
            font-size: 2.3rem;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            letter-spacing: 1px;
        }

        /* Semester Divider */
        .semester-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-gold);
            margin: 1.8rem 0 1.2rem;
            position: relative;
            display: inline-block;
            padding: 0 15px;
        }

        .semester-title::before, .semester-title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--text-gold));
        }

        .semester-title::before { right: 100%; }
        .semester-title::after { left: 100%; background: linear-gradient(270deg, transparent, var(--text-gold)); }

        /* Buttons Grid System */
        .buttons-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--btn-bg);
            border: 1.5px solid var(--btn-border);
            border-radius: 12px;
            color: var(--text-white);
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .nav-btn:hover {
            border-color: var(--btn-hover-border);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 25px var(--accent-glow);
            background: rgba(20, 45, 75, 0.85);
            color: #ffffff;
        }

        /* Distinct Style for Exams/Alert Button */
        .nav-btn.alert-btn {
            background: var(--alert-bg);
            border-color: var(--alert-border);
            color: #ffffff;
            font-weight: 700;
        }

        .nav-btn.alert-btn:hover {
            background: rgba(185, 28, 28, 0.85);
            border-color: #ff6b6b;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }

        /* Subtle Glow Lines on Button Hover */
        .nav-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }
        .nav-btn:hover::after {
            left: 100%;
        }

        @media (max-width: 480px) {
            .main-title { font-size: 1.8rem; }
            .portal-container { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>

<div class="portal-container">
    <!-- Header Section -->
    <h1 class="main-title">🧬 Third Year 📂</h1>
    <p class="subtitle">Al-Azhar University - Cairo</p>

    <!-- First Semester Section -->
    <div class="semester-title">First Semester</div>
    
    <div class="buttons-list">
        <!-- زر التنبيهات أو الامتحانات -->
        <a href="#" class="nav-btn alert-btn">📜 EXAMS & REVISIONS 📜</a>

        <!-- أزرار المواد - يمكنك تعديل أسماء وروابط المواد بسهولة -->
        <a href="subject1.html" class="nav-btn">Advanced Biochemistry</a>
        <a href="subject2.html" class="nav-btn">Molecular Biology</a>
        <a href="subject3.html" class="nav-btn">Clinical Chemistry</a>
        <a href="subject4.html" class="nav-btn">Enzymology</a>
        <a href="subject5.html" class="nav-btn">Genetics</a>
        <a href="subject6.html" class="nav-btn">Pharmacology</a>
    </div>

    <!-- Second Semester Section -->
    <div class="semester-title">Second Semester</div>

    <div class="buttons-list">
        <a href="#" class="nav-btn">Biotechnology</a>
        <a href="#" class="nav-btn">Immunology</a>
        <a href="#" class="nav-btn">Bioenergetics</a>
    </div>
</div>

</body>
</html>
